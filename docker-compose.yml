version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: vehicle_sale_service_postgres
    restart: always
    environment:
      POSTGRES_DB: vehicle_sale_service_db
      POSTGRES_USER: vehicle_user
      POSTGRES_PASSWORD: vehicle_pass
    ports:
      - "5434:5432"
    volumes:
      - vehicle_sale_service_pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: vehicle_sale_service_app
    restart: always
    ports:
      - "8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/vehicle_sale_service_db
      JDBC_DATABASE_USERNAME: vehicle_user
      JDBC_DATABASE_PASSWORD: vehicle_pass
    depends_on:
      - postgres

volumes:
  vehicle_sale_service_pgdata:
