spring:
  application:
    name: vehicle-sale-service

  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5434/vehicle_sale_service_db}
    username: ${JDBC_DATABASE_USERNAME:vehicle_user}
    password: ${JDBC_DATABASE_PASSWORD:vehicle_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: ${SERVER_PORT:8080}